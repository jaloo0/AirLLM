name: Run Hugging Face Inference

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for the model'
        required: true
        default: 'Explain how layer-wise GPU inference works in 2 sentences.'
        type: string
      model_id:
        description: 'Hugging Face text-generation model ID'
        required: true
        default: 'HuggingFaceTB/SmolLM2-360M-Instruct'
        type: string

jobs:
  run-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Restore cached model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-huggingface-${{ github.event.inputs.model_id }}

      - name: Download model and generate response
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROMPT_TEXT: ${{ github.event.inputs.prompt }}
          MODEL_ID: ${{ github.event.inputs.model_id }}
        run: |
          python -c '
          import os
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          model_id = os.environ["MODEL_ID"]
          prompt = os.environ["PROMPT_TEXT"]
          hf_token = os.environ.get("HF_TOKEN") or None

          tokenizer = AutoTokenizer.from_pretrained(model_id, token=hf_token)
          model = AutoModelForCausalLM.from_pretrained(model_id, token=hf_token)

          if tokenizer.chat_template:
              prompt = tokenizer.apply_chat_template(
                  [{"role": "user", "content": prompt}],
                  tokenize=False,
                  add_generation_prompt=True,
              )

          inputs = tokenizer(
              prompt,
              return_tensors="pt",
              truncation=True,
              max_length=1024,
          )

          with torch.inference_mode():
              output = model.generate(**inputs, max_new_tokens=128, do_sample=False)

          generated_tokens = output[0, inputs["input_ids"].shape[1]:]
          print("\n--- GENERATED RESPONSE ---")
          print(tokenizer.decode(generated_tokens, skip_special_tokens=True))
          '
